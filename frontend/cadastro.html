<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Cadastre-se - Market Gon</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-cadastro">

<div class="pagina-cadastro-wrapper">
  <div class="pagina-cadastro-container">
    
    <!-- Lado Esquerdo: Logo e Frase -->
    <div class="cadastro-marca">
      <img src="assets/logo.png" alt="Market Gon Logo" class="logo-cadastro-grande">
      <p class="frase-cadastro">"Cadastre - se e receba ofertas imbatíveis do MARKET GON"</p>
    </div>

    <!-- Lado Direito: Formulário no formato do Wireframe -->
    <div class="cadastro-card">
      <div class="cadastro-header">
        <h2>Cadastre se no <span class="destaque-logo">MARKET GON</span></h2>
        <div class="linha-divisoria"></div>
        <p class="aviso-obrigatorio">Os campos marcados com (*) são obrigatórios</p>
      </div>

      <form id="form-cadastro">
        <div class="campo">
          <label for="cpf">CPF*</label>
          <input type="text" id="cpf" class="input-underline" required>
        </div>
        <div class="campo">
          <label for="nome">Nome completo*</label>
          <input type="text" id="nome" class="input-underline" required>
        </div>
        <div class="campo">
          <label for="email">Email*</label>
          <input type="email" id="email" class="input-underline" required>
        </div>
        <div class="campo">
          <label for="data_nascimento">Data de nascimento*</label>
          <input type="date" id="data_nascimento" class="input-underline" required>
        </div>
        <div class="campo">
          <label for="senha">Senha*</label>
          <input type="password" id="senha" class="input-underline" required>
        </div>

        <div class="area-botao">
          <button type="submit" class="btn-avancar">Avançar</button>
        </div>
        <p id="mensagem-erro" class="mensagem-erro"></p>
      </form>
    </div>

  </div>
</div>

<script src="js/api.js"></script>
<script src="js/cadastro.js"></script>
</body>
</html>
