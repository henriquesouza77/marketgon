<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Admin - Produtos - Market Gon</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

<header class="admin-header">
  <div class="header-esquerda">
    <div class="logo">MARKET<br>GON</div>
    <div class="breadcrumb"><a href="index.html">Home</a> › <a href="admin-produtos.html">Dados</a></div>
  </div>
  
  <div class="marca-central">
    <img src="assets/logo.png" alt="Market Gon Logo">
  </div>
  
  <div class="usuario">
    <span class="icone-user">👤</span> <span id="nome-usuario-admin">Henrique</span> adm ▾
    <a href="#" onclick="sair()" class="btn-sair">(Sair)</a>
  </div>
</header>

<div class="admin-layout">
  <aside class="admin-sidebar">
    <div class="saudacao">
      <div class="avatar-circle">👤</div>
      <span>Olá, henrique</span>
    </div>
    <nav>
      <a href="admin-dashboard.html"><span class="icone">👤</span> Dashboard</a>
      <a href="admin-produtos.html" class="ativo"><span class="icone">📦</span> Produtos</a>
      <a href="admin-dashboard.html"><span class="icone">🛒</span> Pedidos</a>
      <a href="admin-produtos.html"><span class="icone">📊</span> Estoque</a>
      <a href="admin-dashboard.html"><span class="icone">📈</span> Analytics</a>
      <a href="admin-dashboard.html"><span class="icone">👥</span> Clientes</a>
    </nav>
  </aside>

  <main class="admin-painel">
    <div class="produtos-header-bar">
      <h2>Produtos</h2>
      <div class="campo-busca-wire">
        <input type="text" id="campo-busca-produto" placeholder="Pesquisar produto">
        <span>🔍</span>
      </div>
      <a href="#" class="link-adicionar-wire" onclick="abrirModalProduto(); return false;">+ Adicionar novo Produto</a>
    </div>

    <div class="grid-produtos-admin" id="grid-produtos-admin"></div>
  </main>
</div>

<!-- Modal de criação/edição de produto -->
<div class="modal-fundo" id="modal-produto">
  <div class="modal-caixa">
    <h3 id="titulo-modal-produto">Adicionar novo produto</h3>
    <form id="form-produto">
      <div class="campo">
        <label>Nome</label>
        <input type="text" id="campo-nome" required>
      </div>
      <div class="campo">
        <label>Descrição</label>
        <textarea id="campo-descricao" rows="2"></textarea>
      </div>
      <div class="linha-dupla">
        <div class="campo">
          <label>Preço (R$)</label>
          <input type="number" step="0.01" id="campo-preco" required>
        </div>
        <div class="campo">
          <label>Preço promocional (R$)</label>
          <input type="number" step="0.01" id="campo-preco-promo">
        </div>
      </div>
      <div class="linha-dupla">
        <div class="campo">
          <label>Estoque</label>
          <input type="number" id="campo-estoque" required>
        </div>
        <div class="campo">
          <label>Imagem (arquivo em /assets)</label>
          <input type="text" id="campo-imagem" placeholder="ex: arroz.jpg">
        </div>
      </div>
      <div class="modal-acoes">
        <button type="button" class="cancelar" onclick="fecharModalProduto()">Cancelar</button>
        <button type="submit" class="salvar">Salvar</button>
      </div>
    </form>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
