<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Cadastrar Endereço - Market Gon</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Topo Checkout -->
<div class="barra-navegacao-checkout">
  <a href="index.html">☰ Voltar para compras</a>
  <a href="carrinho.html">ir para o carrinho ›</a>
</div>

<!-- Header Principal -->
<header class="header">
  <div class="logo">MARKET<span>GON</span></div>
  <div class="header-frase" style="display:flex; gap:8px; font-style:normal;">
    <a href="index.html">Home</a> <span>›</span> <a href="#">Dados</a>
  </div>
</header>

<!-- Container Principal (Fundo Claro) -->
<div class="pagina-painel-wrapper">
  <div class="admin-layout">
    
    <!-- Sidebar Esquerda (Card) -->
    <aside class="admin-sidebar">
      <div class="saudacao">
        <span class="avatar">👤</span>
        <span>Olá, henrique</span>
      </div>
      <nav>
        <a href="#">👤 Dados</a>
        <a href="#">💳 Cartoes salvos</a>
        <a href="#" class="ativo">📍 Endereços cadastrados</a>
        <a href="carrinho.html">🛒 Pedidos</a>
      </nav>
    </aside>

    <!-- Painel de Formulário (Card Branco com Borda) -->
    <main class="painel">
      <h2>Cadastrar endereço</h2>
      
      <form id="form-endereco">
        
        <!-- Linha 1: CEP + Botão CEP / Texto Obrigatório -->
        <div class="form-linha">
          <div class="campo" style="flex: 1;">
            <label for="cep">CEP*</label>
            <input type="text" id="cep" class="input-underline" required>
          </div>
          <div class="campo-cep-info" style="flex: 1; display: flex; flex-direction: column; align-items: flex-start; justify-content: flex-end;">
            <a href="https://buscacepinter.correios.com.br/app/endereco/index.php" target="_blank" class="btn-cep">Nao sei meu cep</a>
            <span class="aviso-obrigatorio">Os campos marcados com (*) são obrigatórios</span>
          </div>
        </div>

        <!-- Linha 2: Nome do Destinatário -->
        <div class="form-linha">
          <div class="campo">
            <label for="destinatario">Nome do destinatario*</label>
            <input type="text" id="destinatario" class="input-underline" required>
          </div>
        </div>

        <!-- Linha 3: Endereço + Número -->
        <div class="form-linha">
          <div class="campo" style="flex: 3;">
            <label for="endereco">Endereço*</label>
            <input type="text" id="endereco" class="input-underline" required>
          </div>
          <div class="campo" style="flex: 1;">
            <label for="numero">Numero*</label>
            <input type="text" id="numero" class="input-underline" required>
          </div>
        </div>

        <!-- Linha 4: Bairro -->
        <div class="form-linha">
          <div class="campo">
            <label for="bairro">Bairro*</label>
            <input type="text" id="bairro" class="input-underline" required>
          </div>
        </div>

        <!-- Linha 5: Cidade -->
        <div class="form-linha">
          <div class="campo">
            <label for="cidade">Cidade*</label>
            <input type="text" id="cidade" class="input-underline" required>
          </div>
        </div>

        <!-- Linha 6: Tipo de Local (Caixa) + Ponto de Referência (Linha) -->
        <div class="form-linha" style="align-items: center;">
          <div class="campo" style="flex: 1;">
            <input type="text" id="tipo_local" class="input-box" placeholder="Tipo de local">
          </div>
          <div class="campo" style="flex: 1.5;">
            <label for="ponto_referencia">Ponto de referencia</label>
            <input type="text" id="ponto_referencia" class="input-underline">
          </div>
        </div>

        <button type="submit" class="btn-primario" style="max-width:220px; margin-top: 20px;">Salvar endereço</button>
      </form>
    </main>
  </div>
</div>

<!-- Rodapé Seguro (Preto de Ponta a Ponta) -->
<div class="faixa-segura">
  <svg width="24" height="24" viewBox="0 0 24 24" fill="white"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-5.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg>
  <span>Informações 100% seguras</span>
</div>

<script src="js/api.js"></script>
<script>
document.getElementById('form-endereco').addEventListener('submit', (e) => {
  e.preventDefault();

  // 1. Captura todos os dados digitados
  const dadosEndereco = {
    cep: document.getElementById('cep').value,
    destinatario: document.getElementById('destinatario').value,
    endereco: document.getElementById('endereco').value,
    numero: document.getElementById('numero').value,
    bairro: document.getElementById('bairro').value,
    cidade: document.getElementById('cidade').value,
    tipo_local: document.getElementById('tipo_local').value,
    ponto_referencia: document.getElementById('ponto_referencia').value
  };

  // 2. Salva no navegador do usuário
  localStorage.setItem('mg_endereco_checkout', JSON.stringify(dadosEndereco));

  alert('Endereço salvo com sucesso!');
  window.location.href = 'carrinho.html';
});
</script>
</body>
</html>
