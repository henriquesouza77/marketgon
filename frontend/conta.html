<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Minha Conta - Market Gon</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="header">
  <div class="logo">MARKET<span>GON</span></div>
  <div class="header-frase"><a href="index.html">← Voltar para a loja</a></div>
</header>

<div class="pagina-painel-wrapper">
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="saudacao">
        <span class="avatar">👤</span> <span id="saudacao-nome">Olá</span>
      </div>
      <nav>
        <a href="conta.html" class="ativo">📄 Dados</a>
        <a href="endereco.html">📍 Endereços cadastrados</a>
        <a href="carrinho.html">🛒 Meus pedidos</a>
        <a href="#" onclick="sairCliente()" style="color: #ef4444;">🚪 Sair</a>
      </nav>
    </aside>

    <main class="painel">
      <h2>Meus dados</h2>
      <div class="campo">
        <label>Nome</label>
        <input type="text" id="dado-nome" class="input-underline" disabled>
      </div>
      <div class="campo" style="margin-top: 20px;">
        <label>Email</label>
        <input type="text" id="dado-email" class="input-underline" disabled>
      </div>
      <p style="color:#64748b; font-size:13px; margin-top: 24px;">Para alterar seus dados de cadastro, entre em contato com o suporte.</p>
    </main>
  </div>
</div>

<script>
function sairCliente() {
  localStorage.removeItem('mg_token');
  localStorage.removeItem('mg_usuario');
  window.location.href = 'index.html';
}

document.addEventListener('DOMContentLoaded', () => {
  const usuario = JSON.parse(localStorage.getItem('mg_usuario') || 'null');
  if (!usuario) {
    window.location.href = 'login.html';
    return;
  }
  document.getElementById('saudacao-nome').textContent = 'Olá, ' + usuario.nome;
  document.getElementById('dado-nome').value = usuario.nome;
  document.getElementById('dado-email').value = usuario.email;
});
</script>
</body>
</html>
